name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest tests/ -v

      - name: Verify tool discovery (WSDL -> MCP tools) still works
        run: |
          python examples/soap/run_mock_calculator.py &
          sleep 3
          legacy2mcp inspect --config examples/soap/config.calculator.yaml

      - name: Verify the Orders and Petstore demo configs still generate tools
        run: |
          python examples/soap/mock_orders_service.py &
          sleep 3
          legacy2mcp inspect --config examples/soap/config.orders.yaml
          legacy2mcp inspect --config examples/rest/config.petstore.yaml

  report-smoke:
    # Loads every fixture's HTML report in headless Chromium: no console
    # errors/warnings and no network requests (the report must work offline).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" playwright
          python -m playwright install --with-deps chromium

      - name: Browser smoke test of the analyze report
        run: pytest tests/smoke -v
