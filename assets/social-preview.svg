<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="OWASP legacy2mcp social preview: analyze a codebase, label every business flow by risk, and turn the approved flows into safe MCP tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#151f39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#6f9bf7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#ffffff" opacity="0.04">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280 M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="640" y="118" fill="#48a646" font-size="22" font-weight="800" letter-spacing="5">OWASP</text>
    <text x="640" y="212" fill="#eef1f8" font-size="96" font-weight="800" letter-spacing="-2">legacy<tspan fill="#a371f7">2</tspan>mcp</text>
    <text x="640" y="272" fill="#aab4cd" font-size="30" font-weight="500">Understand any codebase &#8594; approve flows &#8594; safe MCP tools</text>
  </g>

  <!-- glyph: codebase -> flows labelled by risk -> MCP hex (same drawing as the README banner, scaled) -->
  <g transform="translate(470,262) scale(1.5)" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
    <path d="M4 62 h38 l16 16 v68 a6 6 0 0 1 -6 6 h-48 a6 6 0 0 1 -6 -6 v-78 a6 6 0 0 1 6 -6 z" fill="none" stroke="#4b5675" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M42 62 v16 h16" fill="none" stroke="#4b5675" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="27" y="112" text-anchor="middle" fill="#8b93a7" font-size="14" font-weight="700">&lt;/&gt;</text>
    <g stroke="#4b5675" stroke-width="2.5" stroke-linecap="round">
      <line x1="12" y1="126" x2="42" y2="126"/>
      <line x1="12" y1="137" x2="34" y2="137"/>
    </g>
    <g fill="none" stroke="#4b5675" stroke-width="2" stroke-linecap="round">
      <path d="M62 107 Q78 107 94 54"/>
      <path d="M62 107 L94 107"/>
      <path d="M62 107 Q78 107 94 160"/>
    </g>
    <g font-size="10" font-weight="700" letter-spacing="0.6" text-anchor="middle">
      <rect x="94" y="40" width="48" height="28" rx="14" fill="none" stroke="#3fb950" stroke-width="2.5"/>
      <text x="118" y="58" fill="#3fb950">READ</text>
      <rect x="94" y="93" width="48" height="28" rx="14" fill="none" stroke="#d29922" stroke-width="2.5"/>
      <text x="118" y="111" fill="#d29922">WRITE</text>
      <rect x="94" y="146" width="48" height="28" rx="14" fill="none" stroke="#f85149" stroke-width="2.5"/>
      <text x="118" y="164" fill="#f85149">RISK</text>
    </g>
    <path d="M142 54 Q160 54 166 98" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M142 107 L166 107" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>
    <path d="M142 160 Q160 160 166 116" fill="none" stroke="#4b5675" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 5"/>
    <g filter="url(#glow)">
      <path d="M196 72 l30 17 v36 l-30 17 -30 -17 v-36 z" fill="none" stroke="url(#accent)" stroke-width="3.5"/>
    </g>
    <text x="196" y="112" text-anchor="middle" fill="#c9b8f5" font-size="13" font-weight="700" letter-spacing="1">MCP</text>
  </g>

  <text x="640" y="580" text-anchor="middle" fill="#5b657f" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" letter-spacing="1.5">OFFLINE ANALYSIS  &#183;  RISK PER FLOW  &#183;  READ-ONLY BY DEFAULT  &#183;  AUDIT-LOGGED</text>
</svg>
