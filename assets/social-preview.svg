<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="legacy2mcp social preview">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#151f39"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#6f9bf7"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <g stroke="#ffffff" opacity="0.04">
    <path d="M0 160 H1280 M0 320 H1280 M0 480 H1280 M320 0 V640 M640 0 V640 M960 0 V640"/>
  </g>

  <g font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif" text-anchor="middle">
    <text x="640" y="238" fill="#eef1f8" font-size="96" font-weight="800" letter-spacing="-2">legacy<tspan fill="#a371f7">2</tspan>mcp</text>
    <text x="640" y="300" fill="#aab4cd" font-size="33" font-weight="500">Legacy SOAP/WSDL &#8594; safe, typed MCP tools</text>

    <g transform="translate(455,360)">
      <rect x="0" y="0" width="128" height="128" rx="20" fill="none" stroke="#4b5675" stroke-width="4"/>
      <text x="64" y="76" text-anchor="middle" fill="#8b93a7" font-size="26" font-weight="700" letter-spacing="1">SOAP</text>
      <path d="M162 64 H262" stroke="url(#accent)" stroke-width="7" stroke-linecap="round"/>
      <path d="M244 46 L270 64 L244 82" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <g filter="url(#glow)">
        <path d="M356 0 l56 33 v62 l-56 33 -56 -33 v-62 z" fill="none" stroke="url(#accent)" stroke-width="6"/>
      </g>
      <text x="356" y="75" text-anchor="middle" fill="#c9b8f5" font-size="24" font-weight="700" letter-spacing="1">MCP</text>
    </g>

    <text x="640" y="566" fill="#5b657f" font-size="22" font-weight="600" letter-spacing="1.5">SCHEMA-VALIDATED  &#183;  READ-ONLY BY DEFAULT  &#183;  AUDIT-LOGGED</text>
  </g>
</svg>
