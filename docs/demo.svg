<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" font-family="SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14">
  <rect width="820" height="470" rx="10" fill="#1e1e2e"/>
  <rect width="820" height="34" rx="10" fill="#2a2a3c"/>
  <rect y="24" width="820" height="10" fill="#2a2a3c"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f57"/>
  <circle cx="40" cy="17" r="6" fill="#febc2e"/>
  <circle cx="60" cy="17" r="6" fill="#28c840"/>
  <text x="410" y="22" text-anchor="middle" fill="#9399b2">legacy2mcp — turn a WSDL into MCP tools</text>

  <text x="18" y="62" fill="#a6e3a1">$</text>
  <text x="34" y="62" fill="#cdd6f4">legacy2mcp inspect --config examples/soap/config.calculator.yaml</text>

  <text x="18" y="94"  fill="#6c7086">[</text>
  <text x="18" y="114" fill="#cdd6f4"><tspan fill="#6c7086">  {</tspan></text>
  <text x="18" y="134" fill="#cdd6f4">    <tspan fill="#89b4fa">"name"</tspan>: <tspan fill="#a6e3a1">"calculator_Add"</tspan>,</text>
  <text x="18" y="154" fill="#cdd6f4">    <tspan fill="#89b4fa">"description"</tspan>: <tspan fill="#a6e3a1">"SOAP operation 'Add' on service 'Calculator'."</tspan>,</text>
  <text x="18" y="174" fill="#cdd6f4">    <tspan fill="#89b4fa">"input_schema"</tspan>: {</text>
  <text x="18" y="194" fill="#cdd6f4">      <tspan fill="#89b4fa">"type"</tspan>: <tspan fill="#a6e3a1">"object"</tspan>,</text>
  <text x="18" y="214" fill="#cdd6f4">      <tspan fill="#89b4fa">"properties"</tspan>: {</text>
  <text x="18" y="234" fill="#cdd6f4">        <tspan fill="#89b4fa">"intA"</tspan>: { <tspan fill="#89b4fa">"type"</tspan>: <tspan fill="#a6e3a1">"integer"</tspan> },</text>
  <text x="18" y="254" fill="#cdd6f4">        <tspan fill="#89b4fa">"intB"</tspan>: { <tspan fill="#89b4fa">"type"</tspan>: <tspan fill="#a6e3a1">"integer"</tspan> }</text>
  <text x="18" y="274" fill="#cdd6f4">      },</text>
  <text x="18" y="294" fill="#cdd6f4">      <tspan fill="#89b4fa">"required"</tspan>: [<tspan fill="#a6e3a1">"intA"</tspan>, <tspan fill="#a6e3a1">"intB"</tspan>],</text>
  <text x="18" y="314" fill="#cdd6f4">      <tspan fill="#89b4fa">"additionalProperties"</tspan>: <tspan fill="#fab387">false</tspan></text>
  <text x="18" y="334" fill="#cdd6f4">    }</text>
  <text x="18" y="354" fill="#6c7086">  },</text>
  <text x="18" y="374" fill="#6c7086">  { "name": "calculator_Subtract", ... },  { "name": "calculator_Multiply", ... },</text>
  <text x="18" y="394" fill="#6c7086">  { "name": "calculator_Divide", ... }</text>
  <text x="18" y="414" fill="#6c7086">]</text>

  <text x="18" y="446" fill="#a6e3a1">$</text>
  <text x="34" y="446" fill="#cdd6f4"># 4 WSDL operations -> 4 schema-validated, audit-logged MCP tools. No adapter code.</text>
</svg>
