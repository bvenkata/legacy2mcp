[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy2mcp"
version = "0.6.1"
description = "OWASP legacy2mcp: understand any Python or JS/TS codebase and turn its business flows, SOAP/WSDL services, databases, and REST APIs into safe, typed, audit-logged MCP servers for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Balaji Venkatasubramaniyar" }]
keywords = [
    "mcp", "model-context-protocol", "soap", "wsdl", "ai-agents", "llm",
    "legacy-modernization", "enterprise-integration", "zeep", "claude",
    "database", "postgres", "sql-server", "oracle",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp==2.3.0",
    "zeep>=4.3,<5",
    "jsonschema>=4.21,<5",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "flask>=3.0",
    "lxml>=5.0",
    "pathspec>=0.12,<2",
    "tree-sitter>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
    "anthropic>=2.13,<3",
]
# `legacy2mcp analyze` (whole-codebase analysis). Kept out of the core install
# so the SOAP/DB/REST server path stays as light as it is today. Python is
# parsed with the standard library; tree-sitter is only for JS/TS.
analyze = [
    "pathspec>=0.12,<2",
    "tree-sitter>=0.23,<1",
    "tree-sitter-javascript>=0.23,<1",
    "tree-sitter-typescript>=0.23,<1",
]
# DB adapter drivers -- install only the one(s) you need. Core install has
# no DB driver dependency; the adapter imports these lazily per dialect.
db-postgres = ["psycopg[binary]>=3.1,<4"]
db-mssql = ["pyodbc>=5.0,<6"]
db-oracle = ["oracledb>=2.0,<27"]
# `legacy2mcp init`'s AI assist and `analyze --provider openai` are plain
# HTTP calls via `requests` (already core). `analyze --provider anthropic`
# uses the official Anthropic SDK, installed only with this extra.
ai = ["anthropic>=2.13,<3"]

[project.urls]
Homepage = "https://github.com/OWASP/legacy2mcp"
Repository = "https://github.com/OWASP/legacy2mcp"
Issues = "https://github.com/OWASP/legacy2mcp/issues"
"OWASP Project" = "https://owasp.org/projects/legacy2mcp"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.OWASP/legacy2mcp"

[project.scripts]
legacy2mcp = "legacy2mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legacy2mcp = [
    "py.typed",
    "analysis/report/assets/*",
    "analysis/report/vendor/*",
]