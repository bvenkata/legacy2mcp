[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy2mcp"
version = "0.5.1"
description = "Turn legacy SOAP/WSDL services, databases, and REST APIs into safe, typed, audit-logged MCP servers for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Balaji Venkatasubramaniyar" }]
keywords = [
    "mcp", "model-context-protocol", "soap", "wsdl", "ai-agents", "llm",
    "legacy-modernization", "enterprise-integration", "zeep", "claude",
    "database", "postgres", "sql-server", "oracle",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp==2.3.0",
    "zeep>=4.3,<5",
    "jsonschema>=4.21,<5",
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "requests>=2.31,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "flask>=3.0",
    "lxml>=5.0",
]
# JDBC adapter drivers -- install only the one(s) you need. Core install has
# no JDBC driver dependency; the adapter imports these lazily per dialect.
db-postgres = ["psycopg[binary]>=3.1,<4"]
db-mssql = ["pyodbc>=5.0,<6"]
db-oracle = ["oracledb>=2.0,<27"]
# `legacy2mcp init`'s AI-assisted analysis is a plain HTTP call via
# `requests`, already a core dependency -- there's nothing extra to
# install. This extra is intentionally empty: it exists so the install
# story has a stable `pip install "legacy2mcp[ai]"` name, identical to
# the plain install today, with somewhere to grow into if that changes.
ai = []

[project.urls]
Homepage = "https://github.com/bvenkata/legacy2mcp"
Repository = "https://github.com/bvenkata/legacy2mcp"
Issues = "https://github.com/bvenkata/legacy2mcp/issues"
"MCP Registry" = "https://registry.modelcontextprotocol.io/v0.1/servers?search=io.github.bvenkata/legacy2mcp"

[project.scripts]
legacy2mcp = "legacy2mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
legacy2mcp = ["py.typed"]
